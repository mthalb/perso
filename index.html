<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault · HELIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0F1A;
    --panel:#161B2C;
    --parchment:#E7EAF6;
    --rose:#FF5C7A;
    --gold:#7C6CF5;
    --accent2:#22D3C9;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }
  body{
    background:
      radial-gradient(circle at 15% 20%, rgba(124,108,245,0.28), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(34,211,201,0.20), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(255,92,122,0.14), transparent 55%),
      var(--ink);
    background-size:200% 200%, 200% 200%, 200% 200%, 100% 100%;
    animation:driftBg 22s ease-in-out infinite;
  }
  @keyframes driftBg{
    0%{ background-position:0% 0%, 100% 0%, 50% 100%, 0 0; }
    50%{ background-position:60% 40%, 30% 60%, 40% 30%, 0 0; }
    100%{ background-position:0% 0%, 100% 0%, 50% 100%, 0 0; }
  }
  @media (prefers-reduced-motion: reduce){
    body{ animation:none; }
  }
  .wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6vh 5vw;
  }

  .eyebrow{
    font-size:13px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before, .eyebrow::after{
    content:"";
    width:28px;
    height:1px;
    background:var(--gold);
    opacity:0.6;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(26px, 4vw, 38px);
    margin:0 0 30px;
    text-align:center;
  }

  /* --- Lock screen --- */
  #lockScreen{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:360px;
  }
  #pwForm{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
  }
  #pwInput{
    font-family:'Space Mono', monospace;
    font-size:18px;
    letter-spacing:0.1em;
    text-align:center;
    padding:14px 16px;
    border-radius:10px;
    border:1px solid rgba(231,234,246,0.2);
    background:var(--panel);
    color:var(--parchment);
    outline:none;
    transition:border-color 0.25s ease, box-shadow 0.25s ease;
  }
  #pwInput:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(124,108,245,0.18); }
  #pwSubmit{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:13px 16px;
    border-radius:10px;
    border:none;
    background:var(--gold);
    color:var(--ink);
    cursor:pointer;
    transition:transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  }
  #pwSubmit:hover{ opacity:0.92; transform:translateY(-2px); box-shadow:0 8px 18px rgba(124,108,245,0.28); }
  #pwSubmit:active{ transform:translateY(0); }
  #pwSubmit:disabled{ opacity:0.6; cursor:default; transform:none; box-shadow:none; }
  #pwError{
    color:var(--rose);
    font-size:13px;
    text-align:center;
    min-height:18px;
    margin-top:4px;
  }
  .back-link{
    margin-top:26px;
    font-size:12px;
    color:var(--rose);
    text-decoration:none;
    letter-spacing:0.05em;
    opacity:0.75;
  }
  .back-link:hover{ opacity:1; }

  .credit{
    margin-top:34px;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--parchment);
    opacity:0.35;
    text-align:center;
  }

  /* --- Video gallery --- */
  #gallery{
    display:none;
    width:100%;
    max-width:900px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
    gap:22px;
    width:100%;
  }
  .card{
    background:var(--panel);
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(124,108,245,0.15);
    cursor:pointer;
    transition:transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
  }
  .card:hover{
    transform:translateY(-4px) scale(1.015);
    box-shadow:0 14px 28px rgba(0,0,0,0.45);
    border-color:rgba(124,108,245,0.5);
  }
  .card:active{ transform:translateY(-1px) scale(0.99); }
  /* Fixed 3:4 frame so mixed portrait/landscape clips fill the card evenly
     instead of leaving empty letterbox bars — actual aspect is preserved
     in the floating player when opened. */
  .thumb-wrap{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    background:#000;
    overflow:hidden;
  }
  .thumb-wrap video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .play-badge{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(to top, rgba(0,0,0,0.45), transparent 40%);
  }
  .play-badge::after{
    content:"";
    width:52px;
    height:52px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--gold), var(--accent2));
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
    clip-path:polygon(35% 25%, 35% 75%, 75% 50%);
    transition:transform 0.2s ease, filter 0.2s ease;
  }
  .card:hover .play-badge::after{ transform:scale(1.1); filter:brightness(1.15); }
  .card .label{
    padding:12px 14px;
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--gold);
  }

  /* --- Circle button to games vault --- */
  #gamesBtn{
    position:fixed;
    top:20px;
    right:20px;
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid rgba(124,108,245,0.35);
    background:var(--panel);
    color:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:18px;
    z-index:20;
    transition:transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }
  #gamesBtn:hover{ opacity:0.9; transform:scale(1.1); box-shadow:0 6px 16px rgba(124,108,245,0.3); }
  #gamesBtn:active{ transform:scale(0.95); }

  /* --- Games gate (NO ACCESS reveal) --- */
  #gamesGate{
    display:none;
    position:fixed;
    inset:0;
    background:var(--ink);
    z-index:30;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6vh 5vw;
    text-align:center;
    overflow:hidden;
  }
  /* Layered floating glow orbs — a lightweight "live" animated backdrop
     without needing an actual video file. */
  #gamesGate::before,
  #gamesGate::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.55;
    z-index:0;
    pointer-events:none;
  }
  #gamesGate::before{
    width:46vw; height:46vw;
    max-width:520px; max-height:520px;
    background:radial-gradient(circle, var(--gold), transparent 70%);
    top:-10%; left:-10%;
    animation:orbitA 16s ease-in-out infinite;
  }
  #gamesGate::after{
    width:38vw; height:38vw;
    max-width:440px; max-height:440px;
    background:radial-gradient(circle, var(--rose), transparent 70%);
    bottom:-12%; right:-8%;
    animation:orbitB 18s ease-in-out infinite;
  }
  @keyframes orbitA{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(12vw,8vh) scale(1.15); }
  }
  @keyframes orbitB{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-10vw,-10vh) scale(1.1); }
  }
  .gate-orb-extra{
    position:absolute;
    width:26vw; height:26vw;
    max-width:320px; max-height:320px;
    border-radius:50%;
    filter:blur(50px);
    opacity:0.4;
    background:radial-gradient(circle, var(--accent2), transparent 70%);
    top:55%; left:50%;
    transform:translate(-50%,-50%);
    animation:orbitC 20s ease-in-out infinite;
    z-index:0;
    pointer-events:none;
  }
  @keyframes orbitC{
    0%,100%{ transform:translate(-50%,-50%) scale(1); }
    50%{ transform:translate(-40%,-60%) scale(1.25); }
  }
  @media (prefers-reduced-motion: reduce){
    #gamesGate::before, #gamesGate::after, .gate-orb-extra{ animation:none; }
  }
  #noAccessText{
    position:relative;
    z-index:1;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(32px, 7vw, 54px);
    color:var(--rose);
    cursor:pointer;
    user-select:none;
    margin:0 0 10px;
    text-shadow:0 0 24px rgba(255,92,122,0.45);
    animation:pulseGlow 3.2s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ text-shadow:0 0 18px rgba(255,92,122,0.35); }
    50%{ text-shadow:0 0 34px rgba(255,92,122,0.65); }
  }
  #gateHint{
    position:relative;
    z-index:1;
    font-size:12px;
    color:var(--parchment);
    opacity:0.5;
    margin-bottom:24px;
  }
  #gatePwWrap{
    position:relative;
    z-index:1;
    display:none;
    flex-direction:column;
    gap:14px;
    width:100%;
    max-width:360px;
    padding:26px 24px;
    border-radius:16px;
    background:rgba(22,27,44,0.75);
    border:1px solid rgba(124,108,245,0.25);
    backdrop-filter:blur(10px);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    animation:gateIn 0.35s cubic-bezier(.2,.8,.3,1.2);
  }
  @keyframes gateIn{
    from{ opacity:0; transform:translateY(10px) scale(0.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  #gatePwInput{
    font-family:'Space Mono', monospace;
    font-size:18px;
    letter-spacing:0.1em;
    text-align:center;
    padding:14px 16px;
    border-radius:10px;
    border:1px solid rgba(231,234,246,0.2);
    background:var(--panel);
    color:var(--parchment);
    outline:none;
    transition:border-color 0.25s ease, box-shadow 0.25s ease;
  }
  #gatePwInput:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(124,108,245,0.18); }
  #gatePwSubmit{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:13px 16px;
    border-radius:10px;
    border:none;
    background:linear-gradient(135deg, var(--gold), var(--accent2));
    color:#0B0F1A;
    cursor:pointer;
    transition:transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  }
  #gatePwSubmit:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(124,108,245,0.35); }
  #gatePwSubmit:active{ transform:translateY(0); }
  #gatePwSubmit:disabled{ opacity:0.6; cursor:default; transform:none; box-shadow:none; }
  #gatePwError{
    color:var(--rose);
    font-size:13px;
    text-align:center;
    min-height:18px;
  }
  #gateClose{
    position:relative;
    z-index:1;
    margin-top:26px;
    font-size:12px;
    color:var(--rose);
    background:none;
    border:none;
    cursor:pointer;
    opacity:0.75;
    letter-spacing:0.05em;
    transition:opacity 0.18s ease;
  }
  #gateClose:hover{ opacity:1; }

  /* --- 18+ popup --- */
  #ageOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(27,16,48,0.85);
    z-index:40;
    align-items:center;
    justify-content:center;
  }
  #ageBox{
    background:var(--panel);
    border:1px solid rgba(124,108,245,0.25);
    border-radius:14px;
    padding:32px 28px;
    max-width:320px;
    width:90%;
    text-align:center;
  }
  #ageBox p{
    font-size:15px;
    line-height:1.5;
    margin:0 0 22px;
  }
  .age-btns{
    display:flex;
    gap:12px;
    justify-content:center;
  }
  .age-btns button{
    flex:1;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:12px 10px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    transition:transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  }
  .age-btns button:hover{ transform:translateY(-2px); opacity:0.92; }
  .age-btns button:active{ transform:translateY(0); }
  #ageYes{ background:var(--gold); color:var(--ink); }
  #ageYes:hover{ box-shadow:0 8px 18px rgba(124,108,245,0.3); }
  #ageNo{ background:transparent; color:var(--rose); border:1px solid var(--rose) !important; }

  /* --- Games gallery --- */
  #gamesGallery{
    display:none;
    width:100%;
    max-width:900px;
  }

  /* --- Floating video player (lightbox) --- */
  #playerOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,6,18,0.88);
    backdrop-filter:blur(4px);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:4vh 4vw;
    opacity:0;
    transition:opacity 0.22s ease;
  }
  #playerOverlay.show{ opacity:1; }
  #playerBox{
    position:relative;
    background:#000;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.55);
    max-width:92vw;
    max-height:88vh;
    min-width:280px;
    transform:scale(0.92) translateY(14px);
    transition:transform 0.25s cubic-bezier(.2,.8,.3,1.2);
  }
  #playerOverlay.show #playerBox{ transform:scale(1) translateY(0); }
  #playerVideo{
    display:block;
    max-width:92vw;
    max-height:88vh;
    background:#000;
  }
  /* Fullscreen: let the box fill the whole screen and keep the video
     centered + fully visible (contain) instead of being cropped or
     stuck at its old popup size — this is what fixes portrait/reels
     clips not fitting once fullscreen is pressed. */
  #playerBox:fullscreen,
  #playerBox:-webkit-full-screen{
    width:100vw;
    height:100vh;
    max-width:100vw;
    max-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:0;
    background:#000;
  }
  #playerBox:fullscreen #playerVideo,
  #playerBox:-webkit-full-screen #playerVideo{
    width:auto;
    height:auto;
    max-width:100vw;
    max-height:100vh;
    object-fit:contain;
  }
  #playerBox:fullscreen #playerControls,
  #playerBox:-webkit-full-screen #playerControls{
    max-width:100vw;
  }
  #playerClose{
    position:absolute;
    top:10px;
    right:10px;
    width:36px;
    height:36px;
    border-radius:50%;
    border:none;
    background:rgba(0,0,0,0.55);
    color:var(--parchment);
    font-size:18px;
    cursor:pointer;
    z-index:2;
    transition:background 0.18s ease, transform 0.18s ease;
  }
  #playerClose:hover{ background:rgba(0,0,0,0.8); transform:scale(1.08); }
  #playerLabel{
    position:absolute;
    left:14px;
    bottom:56px;
    color:var(--parchment);
    font-size:13px;
    letter-spacing:0.03em;
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
    z-index:2;
    pointer-events:none;
  }
  /* Custom control bar — avoids the mobile "tap speaker = instant mute/max
     volume" jump that native <video controls> volume buttons cause. */
  #playerControls{
    position:absolute;
    left:0; right:0; bottom:0;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    z-index:2;
  }
  #playerControls button{
    background:none;
    border:none;
    color:var(--parchment);
    font-size:17px;
    cursor:pointer;
    padding:4px;
    line-height:1;
    flex-shrink:0;
    transition:transform 0.15s ease, color 0.15s ease;
  }
  #playerControls button:hover{ color:var(--gold); transform:scale(1.1); }
  #playerSeek{
    flex:1 1 100%;
    order:1;
    accent-color:var(--gold);
    cursor:pointer;
  }
  #playerVolume{
    width:60px;
    min-width:40px;
    accent-color:var(--gold);
    cursor:pointer;
  }

  @media (max-width:640px){
    .wrap{ padding:4vh 4vw; }
    h1{ margin-bottom:20px; }
    .grid{ grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px; }
    .card .label{ font-size:12px; padding:9px 10px; }
    #gamesBtn{ top:12px; right:12px; width:40px; height:40px; font-size:16px; }
    #playerVolume{ width:48px; }
    #playerControls{ gap:6px; padding:8px; }
    #ageBox{ padding:24px 18px; }
  }

  /* --- Admin --- */
  #adminGear{
    position:fixed;
    bottom:14px;
    left:14px;
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid rgba(231,234,246,0.15);
    background:rgba(22,27,44,0.6);
    color:var(--parchment);
    opacity:0.35;
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:60;
    transition:opacity 0.18s ease, transform 0.18s ease;
  }
  #adminGear:hover{ opacity:0.9; transform:rotate(35deg); }

  .admin-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,6,18,0.88);
    backdrop-filter:blur(4px);
    z-index:70;
    align-items:center;
    justify-content:center;
    padding:4vh 4vw;
  }
  .admin-box{
    background:rgba(22,27,44,0.9);
    border:1px solid rgba(124,108,245,0.25);
    border-radius:16px;
    padding:28px 26px;
    width:100%;
    max-width:340px;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    animation:gateIn 0.3s cubic-bezier(.2,.8,.3,1.2);
  }
  .admin-box.wide{ max-width:560px; }
  .admin-box h2{
    margin:0 0 18px;
    font-family:'Fraunces', serif;
    font-size:22px;
    color:var(--parchment);
    text-align:center;
  }
  .admin-field{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:14px;
  }
  .admin-field label{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    opacity:0.55;
  }
  .admin-field input[type="password"],
  .admin-field input[type="text"],
  .admin-field select{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:11px 13px;
    border-radius:9px;
    border:1px solid rgba(231,234,246,0.2);
    background:var(--ink);
    color:var(--parchment);
    outline:none;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .admin-field input:focus,
  .admin-field select:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(124,108,245,0.18); }
  .admin-field input[type="file"]{
    font-size:13px;
    color:var(--parchment);
  }
  .admin-btn{
    width:100%;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:12px;
    border-radius:9px;
    border:none;
    background:linear-gradient(135deg, var(--gold), var(--accent2));
    color:#0B0F1A;
    cursor:pointer;
    transition:transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  }
  .admin-btn:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(124,108,245,0.32); }
  .admin-btn:disabled{ opacity:0.55; cursor:default; transform:none; box-shadow:none; }
  .admin-btn-ghost{
    background:none;
    border:1px solid rgba(231,234,246,0.2);
    color:var(--parchment);
  }
  .admin-error{
    color:var(--rose);
    font-size:12px;
    text-align:center;
    min-height:16px;
    margin-top:6px;
  }
  .admin-status{
    font-size:12px;
    text-align:center;
    min-height:16px;
    margin-top:6px;
    color:var(--accent2);
  }
  .admin-tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .admin-tab{
    flex:1;
    text-align:center;
    padding:9px;
    border-radius:8px;
    border:1px solid rgba(231,234,246,0.15);
    background:transparent;
    color:var(--parchment);
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background 0.18s ease, border-color 0.18s ease;
  }
  .admin-tab.active{
    background:rgba(124,108,245,0.22);
    border-color:var(--gold);
    color:var(--gold);
  }
  .admin-list{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:220px;
    overflow-y:auto;
  }
  .admin-list-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:9px 12px;
    border-radius:8px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(231,234,246,0.08);
    font-size:13px;
  }
  .admin-list-item span{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .admin-list-item button{
    flex-shrink:0;
    background:none;
    border:none;
    color:var(--rose);
    font-size:12px;
    cursor:pointer;
    opacity:0.75;
  }
  .admin-list-item button:hover{ opacity:1; }
  .admin-close-row{
    display:flex;
    justify-content:flex-end;
    margin-top:16px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">Private</div>

  <div id="lockScreen">
    <h1>Enter Password</h1>
    <form id="pwForm">
      <input type="password" id="pwInput" placeholder="••••••••" autocomplete="off" />
      <button type="submit" id="pwSubmit">Unlock</button>
    </form>
    <div id="pwError"></div>
    <a href="https://helixmedia.vercel.app/" class="back-link">← back to the page</a>
    <div class="credit">MADE BY HELIX TANVIR</div>
  </div>

  <div id="gallery">
    <button id="gamesBtn" title="•">●</button>
    <h1>Vault</h1>
    <div class="grid" id="videoGrid"></div>
    <a href="https://helixmedia.vercel.app/" class="back-link">← back to the page</a>
    <div class="credit">MADE BY HELIX TANVIR</div>
  </div>

  <!-- Second vault: gameplay clips, hidden behind a "NO ACCESS" reveal + its own password -->
  <div id="gamesGate">
    <div class="gate-orb-extra"></div>
    <div id="noAccessText">NO ACCESS</div>
    <div id="gateHint"></div>
    <form id="gatePwWrap">
      <input type="password" id="gatePwInput" placeholder="••••••••" autocomplete="off" />
      <button type="submit" id="gatePwSubmit">Unlock</button>
      <div id="gatePwError"></div>
    </form>
    <button id="gateClose" type="button">← back</button>
    <div class="credit" style="position:relative;z-index:1;">MADE BY HELIX TANVIR</div>
  </div>

  <!-- 18+ confirmation, shown right after a correct games-vault password -->
  <div id="ageOverlay">
    <div id="ageBox">
      <p>This section contains gameplay content.<br>Are you 18 or older?</p>
      <div class="age-btns">
        <button id="ageNo" type="button">No</button>
        <button id="ageYes" type="button">Yes</button>
      </div>
    </div>
  </div>

  <div id="gamesGallery">
    <h1>Games</h1>
    <div class="grid" id="gamesVideoGrid"></div>
    <a href="https://perso-livid.vercel.app/" class="back-link">← back to the page</a>
    <div class="credit">MADE BY HELIX TANVIR</div>
  </div>

  <!-- Floating video player: opens when a card is clicked -->
  <div id="playerOverlay">
    <div id="playerBox">
      <video id="playerVideo" playsinline></video>
      <div id="playerLabel"></div>
      <button id="playerClose" type="button" aria-label="Close">✕</button>
      <div id="playerControls">
        <button id="playerPlay" type="button" aria-label="Play/Pause">▶</button>
        <input id="playerSeek" type="range" min="0" max="100" value="0" step="0.1" />
        <button id="playerMute" type="button" aria-label="Mute">🔊</button>
        <input id="playerVolume" type="range" min="0" max="1" value="0.6" step="0.01" />
        <button id="playerFull" type="button" aria-label="Fullscreen">⛶</button>
      </div>
    </div>
  </div>

  <!-- Admin: low-key entry point, bottom-left -->
  <button id="adminGear" type="button" title="Admin">⚙</button>

  <div class="admin-overlay" id="adminLoginOverlay">
    <div class="admin-box">
      <h2>Admin</h2>
      <form id="adminLoginForm">
        <div class="admin-field">
          <label>Password</label>
          <input type="password" id="adminPwInput" autocomplete="off" />
        </div>
        <button type="submit" class="admin-btn" id="adminLoginBtn">Log in</button>
        <div class="admin-error" id="adminLoginError"></div>
      </form>
      <div class="admin-close-row">
        <button type="button" class="admin-btn admin-btn-ghost" id="adminLoginCancel" style="width:auto;padding:8px 14px;">Cancel</button>
      </div>
    </div>
  </div>

  <div class="admin-overlay" id="adminPanelOverlay">
    <div class="admin-box wide">
      <h2>Upload a video</h2>
      <div class="admin-tabs">
        <button type="button" class="admin-tab active" data-vault="kids">Kids vault</button>
        <button type="button" class="admin-tab" data-vault="games">Games vault</button>
      </div>
      <form id="adminUploadForm">
        <div class="admin-field">
          <label>Video file</label>
          <input type="file" id="adminFileInput" accept="video/*" />
        </div>
        <div class="admin-field">
          <label>Name / label</label>
          <input type="text" id="adminLabelInput" placeholder="e.g. PUBG raid" autocomplete="off" />
        </div>
        <button type="submit" class="admin-btn" id="adminUploadBtn">＋ Add video</button>
        <div class="admin-status" id="adminStatus"></div>
        <div class="admin-error" id="adminUploadError"></div>
      </form>
      <div class="admin-list" id="adminList"></div>
      <div class="admin-close-row">
        <button type="button" class="admin-btn admin-btn-ghost" id="adminPanelClose" style="width:auto;padding:8px 14px;">Close</button>
      </div>
    </div>
  </div>

</div>

<script>
// The password is checked server-side (see /api/login.js) — it never ships
// to the browser, and the video list/files are only served once a valid
// session cookie is present (see /api/videos.js and /api/video.js).

const form = document.getElementById('pwForm');
const input = document.getElementById('pwInput');
const submitBtn = document.getElementById('pwSubmit');
const errEl = document.getElementById('pwError');

function buildCard(v){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="thumb-wrap">
      <video preload="metadata" src="${v.src}#t=0.5" muted playsinline></video>
      <div class="play-badge"></div>
    </div>
    <div class="label">${v.label}</div>
  `;
  card.addEventListener('click', () => openPlayer(v));
  return card;
}

async function showGallery(){
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = '';

  const res = await fetch('/api/videos?vault=kids', { credentials: 'include' });
  if (!res.ok) {
    errEl.textContent = 'Session expired — please try again.';
    return;
  }
  const { videos } = await res.json();

  videos.forEach(v => grid.appendChild(buildCard(v)));

  document.getElementById('lockScreen').style.display = 'none';
  const gallery = document.getElementById('gallery');
  gallery.style.display = 'flex';
  gallery.style.flexDirection = 'column';
  gallery.style.alignItems = 'center';
}

// NOTE: no auto-skip of the lock screen on load anymore — a session is only
// honored for as long as the tab stays open (see the pagehide logout below).
// That means every fresh visit, including a reload after the tab was closed,
// asks for the password again.

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.textContent = '';
  submitBtn.disabled = true;

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ vault: 'kids', password: input.value }),
    });

    if (res.ok) {
      await showGallery();
    } else {
      const data = await res.json().catch(() => ({}));
      errEl.textContent = data.error || 'Incorrect password.';
      input.value = '';
      input.focus();
    }
  } catch (err) {
    errEl.textContent = 'Something went wrong — try again.';
  } finally {
    submitBtn.disabled = false;
  }
});

/* ---------------- Games vault (18+) ---------------- */

const gamesBtn = document.getElementById('gamesBtn');
const gamesGate = document.getElementById('gamesGate');
const noAccessText = document.getElementById('noAccessText');
const gateHint = document.getElementById('gateHint');
const gatePwWrap = document.getElementById('gatePwWrap');
const gatePwInput = document.getElementById('gatePwInput');
const gatePwSubmit = document.getElementById('gatePwSubmit');
const gatePwError = document.getElementById('gatePwError');
const gateClose = document.getElementById('gateClose');
const ageOverlay = document.getElementById('ageOverlay');
const ageYes = document.getElementById('ageYes');
const ageNo = document.getElementById('ageNo');
const gamesGallery = document.getElementById('gamesGallery');

let noAccessClicks = 0;

function resetGamesGate(){
  noAccessClicks = 0;
  gatePwWrap.style.display = 'none';
  gateHint.textContent = '';
  gatePwInput.value = '';
  gatePwError.textContent = '';
}

gamesBtn.addEventListener('click', () => {
  resetGamesGate();
  document.getElementById('gallery').style.display = 'none';
  gamesGate.style.display = 'flex';
});

gateClose.addEventListener('click', () => {
  gamesGate.style.display = 'none';
  document.getElementById('gallery').style.display = 'flex';
});

noAccessText.addEventListener('click', () => {
  noAccessClicks++;
  if (noAccessClicks >= 3 && gatePwWrap.style.display === 'none') {
    gatePwWrap.style.display = 'flex';
    gateHint.textContent = '';
    gatePwInput.focus();
  }
});

gatePwWrap.addEventListener('submit', async (e) => {
  e.preventDefault();
  gatePwError.textContent = '';
  gatePwSubmit.disabled = true;

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ vault: 'games', password: gatePwInput.value }),
    });

    if (res.ok) {
      gamesGate.style.display = 'none';
      ageOverlay.style.display = 'flex';
    } else {
      const data = await res.json().catch(() => ({}));
      gatePwError.textContent = data.error || 'Incorrect password.';
      gatePwInput.value = '';
      gatePwInput.focus();
    }
  } catch (err) {
    gatePwError.textContent = 'Something went wrong — try again.';
  } finally {
    gatePwSubmit.disabled = false;
  }
});

ageNo.addEventListener('click', async () => {
  // Kicked back out: clear the games session and return to the main vault.
  try {
    await fetch('/api/logout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ vault: 'games' }),
    });
  } catch (err) {}
  ageOverlay.style.display = 'none';
  document.getElementById('gallery').style.display = 'flex';
});

ageYes.addEventListener('click', async () => {
  ageOverlay.style.display = 'none';

  const grid = document.getElementById('gamesVideoGrid');
  grid.innerHTML = '';

  const res = await fetch('/api/videos?vault=games', { credentials: 'include' });
  if (!res.ok) {
    document.getElementById('gallery').style.display = 'flex';
    return;
  }
  const { videos } = await res.json();

  videos.forEach(v => grid.appendChild(buildCard(v)));

  gamesGallery.style.display = 'flex';
  gamesGallery.style.flexDirection = 'column';
  gamesGallery.style.alignItems = 'center';
});

/* ---------------- Floating video player ---------------- */

const playerOverlay = document.getElementById('playerOverlay');
const playerVideo = document.getElementById('playerVideo');
const playerLabel = document.getElementById('playerLabel');
const playerClose = document.getElementById('playerClose');
const playerPlay = document.getElementById('playerPlay');
const playerSeek = document.getElementById('playerSeek');
const playerMute = document.getElementById('playerMute');
const playerVolume = document.getElementById('playerVolume');
const playerFull = document.getElementById('playerFull');

// Start at a moderate volume rather than whatever the browser defaults to —
// this is what fixes the "tap the speaker icon and it jumps to full blast
// or instant mute" behavior: there's no native volume rocker anymore, just
// this slider, which always moves gradually from wherever it currently is.
let lastVolume = 0.6;

function openPlayer(v){
  playerVideo.src = v.src;
  playerLabel.textContent = v.label || '';
  playerVideo.volume = lastVolume;
  playerVideo.muted = false;
  playerVolume.value = lastVolume;
  playerMute.textContent = '🔊';
  playerPlay.textContent = '⏸';

  playerOverlay.style.display = 'flex';
  requestAnimationFrame(() => playerOverlay.classList.add('show'));
  playerVideo.play().catch(() => {});
}

function closePlayer(){
  playerOverlay.classList.remove('show');
  setTimeout(() => {
    playerOverlay.style.display = 'none';
    playerVideo.pause();
    playerVideo.removeAttribute('src');
    playerVideo.load();
  }, 200);
}

playerClose.addEventListener('click', closePlayer);
playerOverlay.addEventListener('click', (e) => {
  if (e.target === playerOverlay) closePlayer();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && playerOverlay.style.display !== 'none') closePlayer();
});

playerPlay.addEventListener('click', () => {
  if (playerVideo.paused) {
    playerVideo.play();
    playerPlay.textContent = '⏸';
  } else {
    playerVideo.pause();
    playerPlay.textContent = '▶';
  }
});
playerVideo.addEventListener('click', () => playerPlay.click());

playerVideo.addEventListener('timeupdate', () => {
  if (playerVideo.duration) {
    playerSeek.value = (playerVideo.currentTime / playerVideo.duration) * 100;
  }
});
playerSeek.addEventListener('input', () => {
  if (playerVideo.duration) {
    playerVideo.currentTime = (playerSeek.value / 100) * playerVideo.duration;
  }
});

playerVolume.addEventListener('input', () => {
  const vol = parseFloat(playerVolume.value);
  playerVideo.volume = vol;
  playerVideo.muted = false;
  lastVolume = vol;
  playerMute.textContent = vol === 0 ? '🔇' : '🔊';
});
playerMute.addEventListener('click', () => {
  if (playerVideo.muted || playerVideo.volume === 0) {
    playerVideo.muted = false;
    playerVideo.volume = lastVolume || 0.6;
    playerVolume.value = playerVideo.volume;
    playerMute.textContent = '🔊';
  } else {
    lastVolume = playerVideo.volume;
    playerVideo.muted = true;
    playerVolume.value = 0;
    playerMute.textContent = '🔇';
  }
});

playerFull.addEventListener('click', () => {
  const box = document.getElementById('playerBox');
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    (box.requestFullscreen || box.webkitRequestFullscreen)?.call(box);
  }
});

/* ---------------- Admin panel ---------------- */

const adminGear = document.getElementById('adminGear');
const adminLoginOverlay = document.getElementById('adminLoginOverlay');
const adminLoginForm = document.getElementById('adminLoginForm');
const adminPwInput = document.getElementById('adminPwInput');
const adminLoginBtn = document.getElementById('adminLoginBtn');
const adminLoginError = document.getElementById('adminLoginError');
const adminLoginCancel = document.getElementById('adminLoginCancel');

const adminPanelOverlay = document.getElementById('adminPanelOverlay');
const adminPanelClose = document.getElementById('adminPanelClose');
const adminTabs = document.querySelectorAll('.admin-tab');
const adminUploadForm = document.getElementById('adminUploadForm');
const adminFileInput = document.getElementById('adminFileInput');
const adminLabelInput = document.getElementById('adminLabelInput');
const adminUploadBtn = document.getElementById('adminUploadBtn');
const adminStatus = document.getElementById('adminStatus');
const adminUploadError = document.getElementById('adminUploadError');
const adminList = document.getElementById('adminList');

let adminVault = 'kids';

adminGear.addEventListener('click', () => {
  adminLoginError.textContent = '';
  adminPwInput.value = '';
  adminLoginOverlay.style.display = 'flex';
});
adminLoginCancel.addEventListener('click', () => {
  adminLoginOverlay.style.display = 'none';
});

adminLoginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  adminLoginError.textContent = '';
  adminLoginBtn.disabled = true;
  try {
    const res = await fetch('/api/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ password: adminPwInput.value }),
    });
    if (res.ok) {
      adminLoginOverlay.style.display = 'none';
      adminPanelOverlay.style.display = 'flex';
      await loadAdminList();
    } else {
      const data = await res.json().catch(() => ({}));
      adminLoginError.textContent = data.error || 'Incorrect password.';
    }
  } catch (err) {
    adminLoginError.textContent = 'Something went wrong — try again.';
  } finally {
    adminLoginBtn.disabled = false;
  }
});

adminPanelClose.addEventListener('click', () => {
  adminPanelOverlay.style.display = 'none';
});

adminTabs.forEach((tab) => {
  tab.addEventListener('click', async () => {
    adminTabs.forEach((t) => t.classList.remove('active'));
    tab.classList.add('active');
    adminVault = tab.dataset.vault;
    await loadAdminList();
  });
});

async function loadAdminList(){
  adminList.innerHTML = '<div class="admin-status">Loading…</div>';
  try {
    const res = await fetch(`/api/admin-videos?vault=${adminVault}`, { credentials: 'include' });
    if (!res.ok) {
      adminList.innerHTML = '';
      return;
    }
    const { videos } = await res.json();
    renderAdminList(videos);
  } catch (err) {
    adminList.innerHTML = '';
  }
}

function renderAdminList(videos){
  adminList.innerHTML = '';
  if (!videos.length) {
    adminList.innerHTML = '<div class="admin-status" style="opacity:0.5;">No uploads yet in this vault.</div>';
    return;
  }
  videos.forEach((v) => {
    const row = document.createElement('div');
    row.className = 'admin-list-item';
    row.innerHTML = `<span>${v.label || '(untitled)'}</span>`;
    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.textContent = 'Remove';
    delBtn.addEventListener('click', () => deleteAdminVideo(v.id));
    row.appendChild(delBtn);
    adminList.appendChild(row);
  });
}

async function deleteAdminVideo(id){
  try {
    const res = await fetch('/api/admin-videos', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ vault: adminVault, id }),
    });
    if (res.ok) {
      const { videos } = await res.json();
      renderAdminList(videos);
    }
  } catch (err) {}
}

adminUploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  adminUploadError.textContent = '';
  adminStatus.textContent = '';

  const file = adminFileInput.files[0];
  if (!file) {
    adminUploadError.textContent = 'Choose a video file first.';
    return;
  }

  adminUploadBtn.disabled = true;
  try {
    adminStatus.textContent = 'Requesting upload link…';
    const urlRes = await fetch('/api/admin-upload-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ vault: adminVault, filename: file.name, contentType: file.type }),
    });
    if (!urlRes.ok) {
      const data = await urlRes.json().catch(() => ({}));
      throw new Error(data.error || 'Could not start upload.');
    }
    const { uploadUrl, key } = await urlRes.json();

    adminStatus.textContent = 'Uploading video…';
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', uploadUrl);
      xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
      xhr.upload.onprogress = (ev) => {
        if (ev.lengthComputable) {
          const pct = Math.round((ev.loaded / ev.total) * 100);
          adminStatus.textContent = `Uploading video… ${pct}%`;
        }
      };
      xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error('Upload failed.'));
      xhr.onerror = () => reject(new Error('Upload failed.'));
      xhr.send(file);
    });

    adminStatus.textContent = 'Saving entry…';
    const saveRes = await fetch('/api/admin-add-video', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ vault: adminVault, path: key, label: adminLabelInput.value.trim() }),
    });
    if (!saveRes.ok) {
      const data = await saveRes.json().catch(() => ({}));
      throw new Error(data.error || 'Upload succeeded but saving the entry failed.');
    }

    adminStatus.textContent = 'Added ✓';
    adminFileInput.value = '';
    adminLabelInput.value = '';
    await loadAdminList();
    setTimeout(() => { adminStatus.textContent = ''; }, 2000);
  } catch (err) {
    adminUploadError.textContent = err.message || 'Something went wrong.';
    adminStatus.textContent = '';
  } finally {
    adminUploadBtn.disabled = false;
  }
});

/* ---------------- Log out when the visitor actually leaves ----------------
   Without this, the session cookie stays valid for its full 2-hour lifetime,
   so closing the tab and coming back (or opening the link elsewhere) would
   still be unlocked. sendBeacon fires reliably even as the page is unloading. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    navigator.sendBeacon?.('/api/logout', new Blob(
      [JSON.stringify({ vault: 'all' })],
      { type: 'application/json' }
    ));
  }
});
window.addEventListener('pagehide', () => {
  navigator.sendBeacon?.('/api/logout', new Blob(
    [JSON.stringify({ vault: 'all' })],
    { type: 'application/json' }
  ));
});
</script>
</body>
</html>
